# S1 - authentification par cle uniquement
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# S2 - root ne se connecte pas
PermitRootLogin no
# S3 - seuls les membres de acces_ssh
AllowGroups acces_ssh
# S4 - 3 essais max par connexion, session inactive coupee apres 10 min (300 s x 2)
MaxAuthTries 3
ClientAliveInterval 300
ClientAliveCountMax 2
