#!/usr/sbin/nft -f
# J2 - pare-feu : tout ce qui entre est refuse sauf SSH et les connexions deja etablies
# On ne fait PAS "flush ruleset" sinon on efface aussi la table de fail2ban.
# On supprime seulement notre table puis on la recree.
table inet filtre
delete table inet filtre

table inet filtre {
    chain entree {
        type filter hook input priority 0; policy drop;

        # la machine peut se parler a elle-meme
        iif lo accept

        # les reponses aux connexions qu'on a ouvertes (apt, dns, dhcp...)
        ct state established,related accept
        ct state invalid drop

        # ping et icmpv6 (ipv6 marche pas sans)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # SSH
        tcp dport 22 accept
    }

    chain transfert {
        type filter hook forward priority 0; policy drop;
    }

    chain sortie {
        type filter hook output priority 0; policy accept;
    }
}
